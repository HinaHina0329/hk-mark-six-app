<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HK Mark Six 六合彩模擬器</title>
<style>
  :root {
    --bg: #0b1220;
    --card: #152033;
    --accent: #f59e0b;
    --text: #f1f5f9;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
    background: radial-gradient(ellipse at top, #1a2740 0%, #0b1220 70%);
    color: var(--text);
    min-height: 100vh;
    padding: 16px;
  }
  .container { max-width: 920px; margin: 0 auto; }
  h1 { text-align: center; font-size: 1.9rem; margin-bottom: 4px; }
  .subtitle { text-align: center; color: var(--muted); margin-bottom: 20px; font-size: 0.95rem; }
  .card {
    background: var(--card);
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    border: 1px solid rgba(255,255,255,0.05);
  }
  .section-title { font-size: 1.05rem; margin-bottom: 12px; color: var(--accent); font-weight: 700; }
  .radio-group { display: flex; gap: 18px; flex-wrap: wrap; }
  .radio-group label { cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 0.95rem; }
  .btn {
    background: var(--accent);
    color: #111;
    border: none;
    padding: 10px 16px;
    border-radius: 10px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.15s;
    font-size: 0.9rem;
  }
  .btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn-secondary { background: #334155; color: #fff; }
  .btn-danger { background: #ef4444; color: #fff; }
  .btn-primary { background: linear-gradient(135deg, #22c55e, #16a34a); color: #fff; font-size: 1.05rem; padding: 14px 28px; }
  .controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
  input[type="number"] {
    background: #0b1220;
    border: 1px solid #334155;
    color: #fff;
    padding: 8px 10px;
    border-radius: 8px;
    width: 72px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 12px;
    margin: 14px 0;
    justify-items: center;
  }
  .ball {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 1.05rem;
    cursor: pointer;
    user-select: none;
    position: relative;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow:
      inset -4px -4px 10px rgba(0,0,0,0.35),
      inset 4px 4px 10px rgba(255,255,255,0.25),
      0 6px 12px rgba(0,0,0,0.4);
    text-shadow: 0 1px 2px rgba(0,0,0,0.4);
    border: 2px solid rgba(255,255,255,0.15);
  }
  .ball::before {
    content: "";
    position: absolute;
    top: 8%;
    left: 18%;
    width: 38%;
    height: 28%;
    background: linear-gradient(160deg, rgba(255,255,255,0.75), transparent);
    border-radius: 50%;
    pointer-events: none;
  }
  .ball:hover { transform: scale(1.1) translateY(-2px); }
  .ball.selected {
    transform: scale(1.12);
    box-shadow:
      inset -4px -4px 10px rgba(0,0,0,0.35),
      inset 4px 4px 10px rgba(255,255,255,0.25),
      0 0 0 3px #fff,
      0 0 18px rgba(255,255,255,0.7);
  }
  .ball.banker {
    box-shadow:
      inset -4px -4px 10px rgba(0,0,0,0.35),
      inset 4px 4px 10px rgba(255,255,255,0.25),
      0 0 0 3px #f59e0b,
      0 0 16px #f59e0b;
  }
  .ball.leg {
    box-shadow:
      inset -4px -4px 10px rgba(0,0,0,0.35),
      inset 4px 4px 10px rgba(255,255,255,0.25),
      0 0 0 3px #38bdf8,
      0 0 16px #38bdf8;
  }
  .ball.drawn {
    animation: popIn 0.55s cubic-bezier(0.34,1.56,0.64,1), glowPulse 1.6s ease infinite alternate;
  }
  .ball.win {
    animation: winBounce 0.7s ease infinite;
  }
  @keyframes popIn {
    0% { transform: scale(0) rotate(-30deg); opacity: 0; }
    70% { transform: scale(1.2) rotate(5deg); }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }
  @keyframes glowPulse {
    from { filter: brightness(1); }
    to { filter: brightness(1.25); }
  }
  @keyframes winBounce {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.22); }
  }
  .red {
    background: radial-gradient(circle at 35% 30%, #ff6b6b, #dc2626 45%, #991b1b 100%);
    color: #fff;
  }
  .blue {
    background: radial-gradient(circle at 35% 30%, #60a5fa, #2563eb 45%, #1e3a8a 100%);
    color: #fff;
  }
  .green {
    background: radial-gradient(circle at 35% 30%, #4ade80, #16a34a 45%, #14532d 100%);
    color: #fff;
  }
  .metrics { display: flex; gap: 14px; flex-wrap: wrap; margin: 14px 0; }
  .metric {
    background: #0b1220;
    padding: 14px 18px;
    border-radius: 12px;
    flex: 1;
    min-width: 130px;
    text-align: center;
  }
  .metric .value { font-size: 1.5rem; font-weight: 800; color: var(--accent); }
  .metric .label { font-size: 0.8rem; color: var(--muted); margin-top: 3px; }
  .warning { color: #fbbf24; margin: 6px 0; font-size: 0.95rem; }
  .success { color: #4ade80; margin: 6px 0; }
  .info { color: var(--muted); margin: 6px 0; font-size: 0.9rem; }
  .draw-area {
    background: #0b1220;
    border-radius: 16px;
    padding: 20px;
    margin-top: 16px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .draw-balls {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    justify-content: center;
    min-height: 70px;
    align-items: center;
  }
  .draw-balls .ball { width: 60px; height: 60px; font-size: 1.25rem; cursor: default; }
  .prize-list { margin-top: 14px; text-align: left; }
  .prize-list div { margin: 5px 0; font-size: 0.95rem; }
  #confettiCanvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 9999;
  }
  .machine {
    width: 100%;
    height: 120px;
    background: linear-gradient(180deg, #1e293b, #0f172a);
    border-radius: 60px;
    margin: 12px 0;
    position: relative;
    overflow: hidden;
    border: 3px solid #334155;
  }
  .machine-inner {
    position: absolute;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .rolling-ball {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    animation: roll 0.4s linear infinite;
    opacity: 0.85;
  }
  @keyframes roll {
    0% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-18px) rotate(180deg); }
    100% { transform: translateY(0) rotate(360deg); }
  }
  iframe { border-radius: 12px; width: 100%; }
  @media (max-width: 600px) {
    .grid { grid-template-columns: repeat(5, 1fr); gap: 10px; }
    .ball { width: 44px; height: 44px; font-size: 0.95rem; }
    .draw-balls .ball { width: 50px; height: 50px; }
  }
</style>
</head>
<body>
<canvas id="confettiCanvas"></canvas>
<div class="container">
  <h1>HK Mark Six</h1>
  <p class="subtitle">Powered by HinaHinaJavaGod</p>

  <!-- 背景音樂 -->
  <div class="card">
    <div class="section-title">背景音樂</div>
    <div class="controls">
      <button class="btn" onclick="toggleMusic(true)">開啟背景音樂</button>
      <button class="btn btn-secondary" onclick="toggleMusic(false)">關閉背景音樂</button>
    </div>
    <div id="musicEmbed"></div>
    <p id="musicStatus" class="info">背景音樂目前關閉</p>
  </div>

  <!-- 投注方式 -->
  <div class="card">
    <div class="section-title">選擇投注方式</div>
    <div class="radio-group">
      <label><input type="radio" name="method" value="single" checked onchange="changeMethod()"> 單式 (Single)</label>
      <label><input type="radio" name="method" value="multiple" onchange="changeMethod()"> 複式 (Multiple)</label>
      <label><input type="radio" name="method" value="banker" onchange="changeMethod()"> 膽拖 (Banker / Legs)</label>
    </div>
  </div>

  <!-- 智能機選 -->
  <div class="card">
    <div class="section-title">智能機選</div>
    <div id="qpSingleMultiple">
      <div class="controls">
        <label>選幾個號碼：</label>
        <input type="number" id="qpCount" min="6" max="49" value="6">
        <button class="btn" onclick="quickPickBalanced()">平衡機選</button>
        <button class="btn btn-secondary" onclick="quickPickChaos()">完全隨機</button>
      </div>
    </div>
    <div id="qpBanker" style="display:none;">
      <div class="controls">
        <label>膽碼：</label>
        <input type="number" id="bTarget" min="1" max="5" value="2">
        <label>拖碼：</label>
        <input type="number" id="lTarget" min="2" max="48" value="6">
        <button class="btn" onclick="quickPickBanker()">隨機生成膽拖</button>
      </div>
    </div>
    <button class="btn btn-danger" style="margin-top:10px;" onclick="clearAll()">清除所有選擇</button>
  </div>

  <!-- 選號區 -->
  <div class="card">
    <div class="section-title">選擇號碼 (1–49)</div>
    <div id="numberGrid" class="grid"></div>
    <div id="bankerLegInfo" style="display:none;" class="info">膽碼會出現在每一注；拖碼用來組成完整 6 個號碼。</div>
  </div>

  <!-- 結果 -->
  <div class="card">
    <div id="statusMsg" class="info">請選擇號碼或使用機選</div>
    <div id="metricsArea" style="display:none;">
      <div class="metrics">
        <div class="metric">
          <div class="value" id="ticketCount">0</div>
          <div class="label">總注數</div>
        </div>
        <div class="metric">
          <div class="value" id="totalCost">$0</div>
          <div class="label">總投注 (HKD)</div>
        </div>
      </div>
      <div class="section-title">中獎機率分佈</div>
      <div id="probList"></div>
      <div id="anyPrize" style="margin-top:10px; font-size:1.05rem;"></div>
    </div>
  </div>

  <!-- 模擬開獎 -->
  <div class="card" id="simCard" style="display:none;">
    <div class="section-title">模擬開獎與派彩</div>
    <button class="btn btn-primary" id="drawBtn" onclick="runSimulation()">開始六合彩開獎模擬！</button>
    <div id="drawResult" style="display:none;">
      <div class="machine" id="machine">
        <div class="machine-inner" id="machineInner"></div>
      </div>
      <div class="draw-area">
        <div class="section-title">本期開獎號碼</div>
        <div class="draw-balls" id="drawnBalls"></div>
        <div id="prizeReport" class="prize-list"></div>
      </div>
    </div>
  </div>
</div>

<script>
// 官方球色
const RED = new Set([1,2,7,8,12,13,18,19,23,24,29,30,34,35,40,46]);
const BLUE = new Set([3,4,9,10,14,15,20,25,26,31,36,37,41,42,47,48]);
function ballColor(n) {
  if (RED.has(n)) return "red";
  if (BLUE.has(n)) return "blue";
  return "green";
}

const TOTAL = 13983816;
const COST = 10;
const PRIZE_ODDS = {
  "頭獎 (6 正碼)": 1 / TOTAL,
  "二獎 (5 正 + 特別)": 6 / TOTAL,
  "三獎 (5 正碼)": 252 / TOTAL,
  "四獎 (4 正 + 特別)": 630 / TOTAL,
  "五獎 (4 正碼)": 12915 / TOTAL,
  "六獎 (3 正 + 特別)": 17220 / TOTAL,
  "七獎 (3 正碼)": 229600 / TOTAL
};
const ANY_PROB = Object.values(PRIZE_ODDS).reduce((a,b)=>a+b,0);
const PAYOUTS = {
  "頭獎 (6 正碼)": 8000000,
  "二獎 (5 正 + 特別)": 1500000,
  "三獎 (5 正碼)": 80000,
  "四獎 (4 正 + 特別)": 9600,
  "五獎 (4 正碼)": 640,
  "六獎 (3 正 + 特別)": 320,
  "七獎 (3 正碼)": 40
};

let selected = [], bankers = [], legs = [], method = "single";
let audioCtx = null;

function getCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function tone(freq, dur, type="sine", vol=0.15, delay=0) {
  const ctx = getCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain); gain.connect(ctx.destination);
  osc.type = type;
  osc.frequency.value = freq;
  const t = ctx.currentTime + delay;
  gain.gain.setValueAtTime(vol, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
  osc.start(t); osc.stop(t + dur);
}
function playTick() { tone(900, 0.07, "sine", 0.12); }
function playReveal() { tone(600, 0.12, "triangle", 0.18); }
function playWin() {
  [523,659,784,1047,1319].forEach((f,i)=>tone(f,0.25,"sine",0.18,i*0.12));
}
function playLose() {
  tone(280,0.4,"sawtooth",0.12);
  tone(180,0.5,"sawtooth",0.1,0.15);
}
function playMachine() {
  for (let i=0;i<8;i++) tone(200+Math.random()*400, 0.08, "square", 0.06, i*0.07);
}

// 背景音樂（你原本的 YouTube）
function toggleMusic(on) {
  const embed = document.getElementById("musicEmbed");
  const status = document.getElementById("musicStatus");
  if (on) {
    embed.innerHTML = `
      <iframe width="100%" height="200"
        src="https://www.youtube.com/embed/ZRtdQ81jPUQ?autoplay=1&loop=1&playlist=ZRtdQ81jPUQ&rel=0"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen>
      </iframe>`;
    status.textContent = "背景音樂已載入，請點播放器中的 ▶ 開始播放";
  } else {
    embed.innerHTML = "";
    status.textContent = "背景音樂目前關閉";
  }
}

function combinations(arr, k) {
  const res = [];
  function helper(start, combo) {
    if (combo.length === k) { res.push([...combo]); return; }
    for (let i=start; i<arr.length; i++) {
      combo.push(arr[i]);
      helper(i+1, combo);
      combo.pop();
    }
  }
  helper(0, []);
  return res;
}
function shuffle(a) {
  for (let i=a.length-1;i>0;i--) {
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function generateBalanced(n) {
  const all = Array.from({length:49},(_,i)=>i+1);
  for (let t=0;t<600;t++) {
    const s = shuffle([...all]).slice(0,n).sort((a,b)=>a-b);
    const lows = s.filter(x=>x<=24).length;
    const odds = s.filter(x=>x%2).length;
    if (Math.abs(lows-n/2)<=1.5 && Math.abs(odds-n/2)<=1.5) return s;
  }
  return shuffle([...all]).slice(0,n).sort((a,b)=>a-b);
}

function renderGrid() {
  const grid = document.getElementById("numberGrid");
  grid.innerHTML = "";
  for (let n=1;n<=49;n++) {
    const ball = document.createElement("div");
    ball.className = `ball ${ballColor(n)}`;
    ball.textContent = String(n).padStart(2,"0");
    if (method==="banker") {
      if (bankers.includes(n)) ball.classList.add("banker","selected");
      else if (legs.includes(n)) ball.classList.add("leg","selected");
    } else if (selected.includes(n)) {
      ball.classList.add("selected");
    }
    ball.onclick = () => toggleNumber(n);
    grid.appendChild(ball);
  }
}

function toggleNumber(n) {
  playTick();
  if (method==="banker") {
    if (bankers.includes(n)) bankers = bankers.filter(x=>x!==n);
    else if (legs.includes(n)) legs = legs.filter(x=>x!==n);
    else if (bankers.length < 5) bankers.push(n);
    else legs.push(n);
    bankers.sort((a,b)=>a-b);
    legs.sort((a,b)=>a-b);
  } else {
    if (selected.includes(n)) selected = selected.filter(x=>x!==n);
    else selected.push(n);
    selected.sort((a,b)=>a-b);
  }
  renderGrid();
  evaluate();
}

function changeMethod() {
  method = document.querySelector('input[name="method"]:checked').value;
  document.getElementById("qpSingleMultiple").style.display = method==="banker" ? "none" : "block";
  document.getElementById("qpBanker").style.display = method==="banker" ? "block" : "none";
  document.getElementById("bankerLegInfo").style.display = method==="banker" ? "block" : "none";
  if (method==="single") document.getElementById("qpCount").value = 6;
  else if (method==="multiple") document.getElementById("qpCount").value = 8;
  renderGrid();
  evaluate();
}

function clearAll() {
  selected=[]; bankers=[]; legs=[];
  renderGrid(); evaluate();
}

function quickPickBalanced() {
  const c = parseInt(document.getElementById("qpCount").value)||6;
  selected = generateBalanced(c);
  renderGrid(); evaluate();
}
function quickPickChaos() {
  const c = parseInt(document.getElementById("qpCount").value)||6;
  selected = shuffle(Array.from({length:49},(_,i)=>i+1)).slice(0,c).sort((a,b)=>a-b);
  renderGrid(); evaluate();
}
function quickPickBanker() {
  const bt = parseInt(document.getElementById("bTarget").value)||2;
  const lt = parseInt(document.getElementById("lTarget").value)||6;
  const pool = Array.from({length:49},(_,i)=>i+1);
  bankers = shuffle([...pool]).slice(0,bt).sort((a,b)=>a-b);
  legs = shuffle(pool.filter(x=>!bankers.includes(x))).slice(0,lt).sort((a,b)=>a-b);
  renderGrid(); evaluate();
}

function evaluate() {
  const status = document.getElementById("statusMsg");
  const metrics = document.getElementById("metricsArea");
  const sim = document.getElementById("simCard");
  let valid=false, tickets=0;

  if (method==="single") {
    if (selected.length===6) { valid=true; tickets=1; }
    else { status.className="warning"; status.textContent="單式必須剛好選 6 個號碼。"; }
  } else if (method==="multiple") {
    if (selected.length>=7 && selected.length<=49) {
      valid=true; tickets=combinations(selected,6).length;
    } else { status.className="warning"; status.textContent="複式請選 7 到 49 個號碼。"; }
  } else {
    const b=bankers.length, l=legs.length;
    if (b<1||b>5) { status.className="warning"; status.textContent="膽碼必須 1–5 個。"; }
    else if (b+l<7) { status.className="warning"; status.textContent="膽+拖合計至少 7 個。"; }
    else { valid=true; tickets=combinations(legs,6-b).length; }
  }

  if (valid && tickets>0) {
    status.className="success"; status.textContent="投注成功！";
    metrics.style.display="block"; sim.style.display="block";
    document.getElementById("ticketCount").textContent = tickets.toLocaleString();
    document.getElementById("totalCost").textContent = "$"+(tickets*COST).toLocaleString();

    let html="";
    for (const [name,p] of Object.entries(PRIZE_ODDS)) {
      const c = Math.min(p*tickets,1);
      const oneIn = c<1 ? (1/c) : 1;
      html += `<div>${name}：<code>${(c*100).toFixed(6)}%</code>　(約 1 比 ${oneIn.toLocaleString(undefined,{maximumFractionDigits:1})})</div>`;
    }
    document.getElementById("probList").innerHTML = html;
    const anyP = Math.min(ANY_PROB*tickets,1);
    const anyIn = anyP<1 ? (1/anyP) : 1;
    document.getElementById("anyPrize").innerHTML =
      `整體中任何獎機率：<strong>${(anyP*100).toFixed(4)}%</strong> (約 1 比 ${anyIn.toFixed(1)})`;
  } else {
    metrics.style.display="none"; sim.style.display="none";
  }
}

function runSimulation() {
  const btn = document.getElementById("drawBtn");
  btn.disabled = true;
  document.getElementById("drawResult").style.display = "block";
  document.getElementById("drawnBalls").innerHTML = "";
  document.getElementById("prizeReport").innerHTML = "";
  const machineInner = document.getElementById("machineInner");
  machineInner.innerHTML = "";

  playMachine();
  for (let i=0;i<9;i++) {
    const b = document.createElement("div");
    b.className = `rolling-ball ${ballColor(Math.floor(Math.random()*49)+1)}`;
    b.style.animationDelay = (i*0.05)+"s";
    machineInner.appendChild(b);
  }

  const drawPool = Array.from({length:49},(_,i)=>i+1);
  const drawnAll = shuffle(drawPool).slice(0,7);
  const mainDrawn = drawnAll.slice(0,6).sort((a,b)=>a-b);
  const special = drawnAll[6];

  let playerTickets = [];
  if (method==="single"||method==="multiple") {
    playerTickets = combinations(selected,6);
  } else {
    const needed = 6 - bankers.length;
    combinations(legs,needed).forEach(lc => {
      playerTickets.push([...bankers,...lc].sort((a,b)=>a-b));
    });
  }

  setTimeout(() => {
    machineInner.innerHTML = "";
    const container = document.getElementById("drawnBalls");
    mainDrawn.forEach((num, idx) => {
      setTimeout(() => {
        const ball = document.createElement("div");
        ball.className = `ball ${ballColor(num)} drawn`;
        ball.textContent = String(num).padStart(2,"0");
        container.appendChild(ball);
        playReveal();
      }, idx * 380);
    });
    setTimeout(() => {
      const sBall = document.createElement("div");
      sBall.className = `ball ${ballColor(special)} drawn`;
      sBall.textContent = String(special).padStart(2,"0");
      sBall.style.outline = "3px solid #fbbf24";
      sBall.title = "特別碼";
      container.appendChild(sBall);
      playReveal();
      setTimeout(() => settlePrize(mainDrawn, special, playerTickets), 400);
    }, 6*380);
  }, 1600);
}

function settlePrize(mainDrawn, special, playerTickets) {
  const summary = {};
  let totalWon = 0;
  const mainSet = new Set(mainDrawn);

  for (const ticket of playerTickets) {
    const tSet = new Set(ticket);
    let matched = 0;
    for (const n of tSet) if (mainSet.has(n)) matched++;
    const hasSpecial = tSet.has(special);
    let key = null;
    if (matched===6) key="頭獎 (6 正碼)";
    else if (matched===5 && hasSpecial) key="二獎 (5 正 + 特別)";
    else if (matched===5) key="三獎 (5 正碼)";
    else if (matched===4 && hasSpecial) key="四獎 (4 正 + 特別)";
    else if (matched===4) key="五獎 (4 正碼)";
    else if (matched===3 && hasSpecial) key="六獎 (3 正 + 特別)";
    else if (matched===3) key="七獎 (3 正碼)";
    if (key) {
      summary[key] = (summary[key]||0)+1;
      totalWon += PAYOUTS[key];
    }
  }

  const spend = playerTickets.length * COST;
  const net = totalWon - spend;
  let html = "";

  if (totalWon > 0) {
    playWin();
    launchConfetti();
    html += `<div class="success" style="font-size:1.2rem;margin-bottom:8px;">恭喜中獎！總獎金 HKD $${totalWon.toLocaleString()}</div>`;
    for (const [k,v] of Object.entries(summary)) {
      html += `<div>🔹 ${k}：中 ${v} 注（每注 $${PAYOUTS[k].toLocaleString()}）</div>`;
    }
    document.querySelectorAll("#drawnBalls .ball").forEach(b => b.classList.add("win"));
  } else {
    playLose();
    html += `<div class="info">很遺憾，本期所有投注均未中獎。再接再厲！</div>`;
  }

  if (net >= 0) html += `<div class="success" style="margin-top:10px;">淨利潤：+HKD $${net.toLocaleString()}</div>`;
  else html += `<div style="color:#f87171;margin-top:10px;">淨虧損：-HKD $${Math.abs(net).toLocaleString()}</div>`;

  document.getElementById("prizeReport").innerHTML = html;
  document.getElementById("drawBtn").disabled = false;
}

function launchConfetti() {
  const canvas = document.getElementById("confettiCanvas");
  const ctx = canvas.getContext("2d");
  canvas.width = innerWidth;
  canvas.height = innerHeight;
  const pieces = Array.from({length:120},()=>({
    x: Math.random()*canvas.width,
    y: Math.random()*canvas.height - canvas.height,
    r: Math.random()*6+3,
    c: ["#ef4444","#3b82f6","#22c55e","#f59e0b","#a855f7","#fff"][Math.floor(Math.random()*6)],
    vy: Math.random()*3+2,
    vx: (Math.random()-0.5)*2,
    rot: Math.random()*360
  }));
  let frame=0;
  function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pieces.forEach(p=>{
      p.y+=p.vy; p.x+=p.vx; p.rot+=3;
      ctx.save();
      ctx.translate(p.x,p.y);
      ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle=p.c;
      ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*0.6);
      ctx.restore();
    });
    frame++;
    if (frame<120) requestAnimationFrame(draw);
    else ctx.clearRect(0,0,canvas.width,canvas.height);
  }
  draw();
}

renderGrid();
evaluate();
</script>
